<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LockFlow Chamber</title><link rel="stylesheet" href="/assets/styles.css"></head>
<body><header><div class="brand"><span class="brand-mark">LF</span>LockFlow</div><nav><a href="/operations">Operations</a><a aria-current="page" href="/chamber">Chamber</a><a href="/interlocks">Interlocks</a><a href="/incidents">Incidents</a></nav></header>
<main><div class="page-title"><div><h1>Chamber situation</h1><div class="muted">Gate, cycle, queue, stowage and signal state</div></div><button id="refresh">Refresh</button></div><div class="grid" id="chambers"></div><div class="message" id="message"></div></main>
<script src="/assets/app.js"></script><script>
const {api,shortID,setMessage}=window.LockFlow; const host=document.querySelector('#chambers'); const message=document.querySelector('#message');
const escapeHTML=(value)=>String(value ?? "").replace(/[&<>"]/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function renderLoading(item){
  if(!item.next_loading){return '<div class="muted">No vessels queued.</div>';}
  const r=item.next_loading;
  const loaded=(r.loadings||[]).map((v)=>`<tr><td>${v.queue_position}</td><td>${escapeHTML(v.name)}</td><td>${escapeHTML(v.call_sign)}</td><td>${v.length_m}</td><td>${v.start_m}–${v.end_m}</td></tr>`).join("");
  const deferred=(r.deferred||[]).map((v)=>`<tr><td>${v.queue_position}</td><td>${escapeHTML(v.name)}</td><td>${escapeHTML(v.call_sign)}</td><td>${v.length_m}</td><td>${v.overflow_m||"-"}</td><td>${escapeHTML(v.reason)}</td></tr>`).join("");
  return `<div class="stow-result ${r.exceeded?"exceeded":"fitted"}"><div class="muted">${r.exceeded?"<strong>Capacity exceeded for next lockage</strong>":"Next lockage fits"} — ${r.vessel_count} vessel(s), occupied ${r.occupied_m}m, remaining ${r.remaining_m}m</div>
    <table><thead><tr><th>#</th><th>Vessel</th><th>Call sign</th><th>Length</th><th>Span m</th></tr></thead><tbody>${loaded||""}</tbody></table>
    ${deferred?`<div class="muted">Deferred</div><table><thead><tr><th>#</th><th>Vessel</th><th>Call sign</th><th>Length</th><th>Overflow m</th><th>Reason</th></tr></thead><tbody>${deferred}</tbody></table>`:""}
    ${r.message?`<div class="message">${escapeHTML(r.message)}</div>`:""}</div>`;
}
async function load(){const items=await api('/api/chambers'); host.innerHTML=items.map((item)=>`<section class="panel"><h2>${item.chamber_id}</h2><div class="metrics"><div class="metric">Stage<strong>${item.cycle?.stage||'idle'}</strong></div><div class="metric">Upstream<strong>${item.gates?.upstream||'-'}</strong></div><div class="metric">Downstream<strong>${item.gates?.downstream||'-'}</strong></div></div><table><tr><th>Cycle</th><td>${shortID(item.cycle?.id)}</td></tr><tr><th>Queue</th><td>${item.queue?.length||0} vessel(s)</td></tr><tr><th>Emergency</th><td>${item.emergency?.status||'idle'}</td></tr><tr><th>Effective length</th><td>${item.stowage?.effective_length_m??'-'} m</td></tr><tr><th>Safety gap</th><td>${item.stowage?.safety_gap_m??'-'} m</td></tr></table><h2 style="margin-top:14px">Next lockage stowage</h2>${renderLoading(item)}</section>`).join(''); setMessage(message,'');}
document.querySelector('#refresh').addEventListener('click',()=>load().catch((e)=>setMessage(message,e.message))); load().catch((e)=>setMessage(message,e.message));
</script></body></html>
